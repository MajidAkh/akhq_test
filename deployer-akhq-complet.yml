---
- name: DC)ploiement d'AKHQ sans accC(s Internet
  hosts: akhq
  become: true
  vars:
    # Configuration
    akhq_version: "0.25.1"
    akhq_local_jar: /data/ansible/ansible-apps_akhq/akhq_test-deploy-se-int/akhq-0.25.1-all.jar # Chemin du JAR sur votre machine de contrC4le
    akhq_admin_passwd: "securepasswd"
    akhq_install_dir: "/opt/akhq"
    
    # Chemin Java aprC(s installation
    java_bin: "/usr/bin/java"
    
    # Configuration des serveurs Kafka bootstrap
    kafka_bootstrap_servers:
      - name: kafka-next-ncy
        servers: "uivpaap00000mzb.int.cm.par.emea.cib:9093,uivpaap00000mzv.int.cm.par.emea.cib:9093,uivpaap00000mzg.int.cm.par.emea.cib:9093,uivpaap00000mzw.int.cm.par.emea.cib:9093"
        properties:
          security.protocol: SASL_SSL
          sasl.mechanism: PLAIN
          sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="client" password="D@ta!A_123456789";
          ssl.truststore.location: /var/ssl/private/kafka_broker.truststore.jks
          ssl.truststore.password: changeit
    
    # Activation des mC)triques Prometheus
    akhq_prometheus_enable: true
    akhq_prometheus_port: 9118
  
  tasks:
    # Installation de Java
    - name: Installer Java (RHEL / CentOS)
      ansible.builtin.yum:
        name: java-11-openjdk
        state: present
      when: ansible_os_family == "RedHat"
      
    - name: Installer Java (Debian / Ubuntu)
      ansible.builtin.apt:
        name: openjdk-11-jdk
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"
    
    # VC)rifier l'installation de Java
    - name: VC)rifier si Java est installC)
      ansible.builtin.command: "{{ java_bin }} -version"
      register: java_version
      changed_when: false
    
    # CrC)er les rC)pertoires
    - name: CrC)er le rC)pertoire d'installation
      ansible.builtin.file:
        path: "{{ akhq_install_dir }}"
        state: directory
        mode: '0755'
    
    - name: CrC)er le rC)pertoire de configuration
      ansible.builtin.file:
        path: "/etc/akhq"
        state: directory
        mode: '0755'
    
    # Copier le fichier JAR d'AKHQ depuis la machine locale
    - name: Copier le fichier JAR d'AKHQ
      ansible.builtin.copy:
        src: "{{ akhq_local_jar }}"
        dest: "{{ akhq_install_dir }}/akhq.jar"
        mode: '0644'
    
    # Convertir le mot de passe en SHA256
    - name: Convertir le mot de passe avec SHA256
      ansible.builtin.shell: |
        echo -n "{{ akhq_admin_passwd }}" | sha256sum
      register: akhq_pwd
      changed_when: false
    
    - name: DC)finir la variable de mot de passe
      ansible.builtin.set_fact:
        akhq_pwd_256: "{{ akhq_pwd.stdout.split(' ')[0] }}"
    
    # CrC)er le fichier de configuration
    - name: CrC)er le fichier de configuration AKHQ
      ansible.builtin.template:
        src: templates/akhq.yml.j2
        dest: "/etc/akhq/application.yml"
        mode: '0644'
    
    # CrC)er le fichier de service systemd
    - name: CrC)er le fichier de service systemd
      ansible.builtin.template:
        src: templates/akhq.service.j2
        dest: "/lib/systemd/system/akhq.service"
        mode: '0644'
    
    # DC)marrer et activer le service
    - name: DC)marrer et activer le service AKHQ
      ansible.builtin.systemd:
        name: akhq
        state: started
        enabled: true
        daemon_reload: true
