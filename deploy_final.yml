---
- name: Deploy AKHQ
  hosts: akhq
  become: true
  vars:
    # Configuration
    akhq_version: "0.25.1"
    akhq_admin_passwd: "securepasswd"
    akhq_install_dir: "/opt/akhq"
    
    # Configuration des serveurs Kafka bootstrap
    kafka_bootstrap_servers:
      - name: kafka-next-ncy
        servers: "uivpaap00000mzb.int.cm.par.emea.cib:9093,uivpaap00000mzv.int.cm.par.emea.cib:9093,uivpaap00000mzg.int.cm.par.emea.cib:9093,uivpaap00000mzw.int.cm.par.emea.cib:9093"
        properties:
          security.protocol: SASL_SSL
          sasl.mechanism: PLAIN
          sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="client" password="D@ta!A_123456789";
          ssl.truststore.location: /var/ssl/private/kafka_broker.truststore.jks
          ssl.truststore.password: changeit
    
    # Activation des métriques Prometheus
    akhq_prometheus_enable: true
    akhq_prometheus_port: 9118

  tasks:
    # Créer répertoire pour AKHQ
    - name: Create installation directory
      ansible.builtin.file:
        path: "{{ akhq_install_dir }}"
        state: directory
        mode: '0755'

    - name: Create bin directory
      ansible.builtin.file:
        path: "{{ akhq_install_dir }}/bin"
        state: directory
        mode: '0755'

    - name: Create lib directory
      ansible.builtin.file:
        path: "{{ akhq_install_dir }}/lib"
        state: directory
        mode: '0755'

    - name: Create configuration directory
      ansible.builtin.file:
        path: "/etc/akhq/"
        state: directory
        mode: '0755'
    
    # Copier le fichier de démarrage
    - name: Copy akhq startup script
      ansible.builtin.copy:
        src: "/data/ansible/ansible-apps_akhq/akhq_test-deploy-se-int/akhq-0.25.1/bin/akhq"
        dest: "{{ akhq_install_dir }}/bin/akhq"
        mode: '0755'
        remote_src: true
    
    # Copier les fichiers lib (attention, peut prendre du temps si beaucoup de fichiers)
    - name: Copy lib files
      ansible.builtin.shell: "cp -R /data/ansible/ansible-apps_akhq/akhq_test-deploy-se-int/akhq-0.25.1/lib/* {{ akhq_install_dir }}/lib/"
      args:
        creates: "{{ akhq_install_dir }}/lib/akhq.jar"
      
    # Convertir mot de passe en SHA256
    - name: Convert password with sha256
      ansible.builtin.shell: |
        echo -n "{{ akhq_admin_passwd }}" | sha256sum
      register: akhq_pwd
      changed_when: false
      
    - name: Set password variable
      ansible.builtin.set_fact:
        akhq_pwd_256: "{{ akhq_pwd.stdout.split(' ')[0] }}"
    
    # Créer le fichier de configuration
    - name: Create AKHQ configuration file
      ansible.builtin.template:
        src: "templates/akhq.yml.j2"
        dest: "/etc/akhq/akhq.yml"
        mode: '0644'
      
    # Créer le fichier service
    - name: Create systemd service file
      ansible.builtin.template:
        src: "templates/akhq.service"
        dest: "/lib/systemd/system/akhq.service"
        mode: '0644'
      
    # Démarrer le service
    - name: Start AKHQ service
      ansible.builtin.systemd:
        name: akhq
        state: started
        enabled: true
        daemon_reload: true
